
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Stardos+Stencil:wght@400;700&display=swap" rel="stylesheet">

    <title>AquaRoulette</title>
    <link rel="stylesheet" href="styles.css">

    <script src="https://cdn.jsdelivr.net/npm/qrcode@latest" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="java.js" defer></script>
</head>

<body>

    <!-- ANIMATED BACKGROUND: EXACTLY 200 CIRCLES -->
    <div class="chips" id="background-chips" aria-hidden="true"></div>

    <div class="container">

        <div class="title">
            <h1>AquaRoulette</h1>
            <p>Not a Simulation. Take Your Chance.</p>
        </div>

        <!-- LIVE STREAM -->
        <div class="live-screen">
            <video
                id="player"
                autoplay
                muted
                playsinline
                loop
            ></video>
        </div>

        <!-- WALLET -->
        <div class="wallet-box">
            <label for="wallet">
                Ready? Enter Your Ðogecoin receiving address:
            </label>

            <input
                type="text"
                id="wallet"
                class="wallet-input"
                minlength="34"
                maxlength="34"
                pattern="[A-Za-z0-9]{34}"
                required
                oninput="this.value = this.value.replace(/[^A-Za-z0-9]/g, '').slice(0, 34)"
            >
        </div>

        <!-- ROULETTE -->
        <div class="roulette">

            <div class="zero-row">
                <button type="button" class="ball green" data-number="0">0</button>
            </div>

            <div class="grid" id="grid"></div>

        </div>

        <!-- SUBMIT -->
        <div class="submit-container">

            <button
                id="submit-button"
                class="vortex-button"
                type="button"
                onclick="
                    const wallet = document.getElementById('wallet').value;
                    const number = document.getElementById('selectedNumber').textContent.trim();

                    if (!/^[A-Za-z0-9]{34}$/.test(wallet)) {
                        document.getElementById('wallet').focus();
                        document.getElementById('wallet').reportValidity();
                        return;
                    }

                    if (number === '' || number === '—') {
                        alert('Please select a roulette number first.');
                        return;
                    }

                    submitForm();

                    this.classList.add('arrow-active');
                    this.querySelector('.button-text').textContent = '↓';
                "
            >
                <span class="button-text">Submit</span>
            </button>

            <div id="please-wait" style="display:none; margin-top:10px;">
                Generating Ðogecoin payment QR code. Please wait
                <span id="dots">...</span>
            </div>

        </div>

        <!-- RESULT -->
        <div class="selection">

            <h2>
                Your Pick:
                <span id="selectedNumber">—</span>
            </h2>

            <p class="wallet-preview">
                Your Wallet:
                <span class="highlight" id="selectedWallet">—</span>
            </p>

            <div id="qrCode"></div>

            <button id="copy-button" style="display:none;">
                Copy Address
            </button>

            <div id="address-container"></div>

            <div id="payment-status" style="display:none;">
                Waiting for Your payment...
                <p>Min: 30Ð Max: 3000Ð</p>
                <p>Payout: 36:1</p>
                <p>QR valid until game starts</p>
            </div>

        </div>

    </div>

    <!-- PHYSICS-BASED ANIMATED BACKGROUND -->
    <script>
    (() => {

        const background = document.getElementById('background-chips');

        const colors = ['red', 'black'];

        const totalChips = 200;

        const chips = [];

        let width = window.innerWidth;
        let height = window.innerHeight;

        // ----------------------------------
        // CREATE EXACTLY 200 CIRCLES
        // ----------------------------------

        for (let i = 0; i < totalChips; i++) {

            const chip = document.createElement('div');

            // Exactly one green circle.
            // Remaining 199 are randomly red or black.

            const color = i === 0
                ? 'green'
                : colors[Math.floor(Math.random() * colors.length)];

            const size = 5 + Math.random() * 30;

            const radius = size / 2;

            chip.className = 'chip ' + color;

            chip.style.setProperty('--size', size + 'px');

            background.appendChild(chip);

            chips.push({

                element: chip,

                x: Math.random() * (width - size),
                y: Math.random() * (height - size),

                radius: radius,

                mass: radius * radius,

                vx: (Math.random() - 0.5) * 100,
                vy: (Math.random() - 0.5) * 100,

                phase: Math.random() * Math.PI * 2

            });

        }

        // ----------------------------------
        // SCREEN RESIZE
        // ----------------------------------

        window.addEventListener('resize', () => {

            width = window.innerWidth;
            height = window.innerHeight;

            chips.forEach(chip => {

                chip.x = Math.max(
                    chip.radius,
                    Math.min(width - chip.radius, chip.x)
                );

                chip.y = Math.max(
                    chip.radius,
                    Math.min(height - chip.radius, chip.y)
                );

            });

        });

        // ----------------------------------
        // COLLISION DETECTION
        // ----------------------------------

        function checkCollisions() {

            for (let i = 0; i < chips.length; i++) {

                for (let j = i + 1; j < chips.length; j++) {

                    const a = chips[i];
                    const b = chips[j];

                    const dx = b.x - a.x;
                    const dy = b.y - a.y;

                    const distance = Math.sqrt(dx * dx + dy * dy);

                    const minDistance = a.radius + b.radius;

                    if (distance < minDistance) {

                        // Collision direction

                        const nx = distance === 0 ? 1 : dx / distance;
                        const ny = distance === 0 ? 0 : dy / distance;

                        // Separate overlapping circles

                        const overlap = minDistance - distance;

                        const totalMass = a.mass + b.mass;

                        a.x -= nx * overlap * (b.mass / totalMass);
                        a.y -= ny * overlap * (b.mass / totalMass);

                        b.x += nx * overlap * (a.mass / totalMass);
                        b.y += ny * overlap * (a.mass / totalMass);

                        // Relative velocity

                        const relativeVelocity =
                            (b.vx - a.vx) * nx +
                            (b.vy - a.vy) * ny;

                        // Only bounce when moving towards each other

                        if (relativeVelocity < 0) {

                            const restitution = 0.95;

                            const impulse =
                                -(1 + restitution) *
                                relativeVelocity /
                                (1 / a.mass + 1 / b.mass);

                            a.vx -= impulse * nx / a.mass;
                            a.vy -= impulse * ny / a.mass;

                            b.vx += impulse * nx / b.mass;
                            b.vy += impulse * ny / b.mass;

                        }

                    }

                }

            }

        }

        // ----------------------------------
        // BOUNCE OFF SCREEN EDGES
        // ----------------------------------

        function checkWalls(chip) {

            if (chip.x - chip.radius < 0) {

                chip.x = chip.radius;
                chip.vx = Math.abs(chip.vx);

            }

            if (chip.x + chip.radius > width) {

                chip.x = width - chip.radius;
                chip.vx = -Math.abs(chip.vx);

            }

            if (chip.y - chip.radius < 0) {

                chip.y = chip.radius;
                chip.vy = Math.abs(chip.vy);

            }

            if (chip.y + chip.radius > height) {

                chip.y = height - chip.radius;
                chip.vy = -Math.abs(chip.vy);

            }

        }

        // ----------------------------------
        // ANIMATION LOOP
        // ----------------------------------

        let previousTime = 0;

        function animate(time) {

            const dt = previousTime
                ? Math.min((time - previousTime) / 1000, 0.025)
                : 0;

            previousTime = time;

            // Move circles

            chips.forEach(chip => {

                chip.x += chip.vx * dt;
                chip.y += chip.vy * dt;

                checkWalls(chip);

            });

            // Detect collisions

            checkCollisions();

            // Draw circles

            chips.forEach(chip => {

                chip.element.style.transform =
                    `translate3d(${chip.x - chip.radius}px,
                                 ${chip.y - chip.radius}px, 0)`;

                // Slow fade in / fade out

                const opacity =
                    0.04 +
                    0.20 *
                    (0.5 + 0.5 * Math.sin(time * 0.0003 + chip.phase));

                chip.element.style.opacity = opacity;

            });

            requestAnimationFrame(animate);

        }

        requestAnimationFrame(animate);

    })();
    </script>

</body>
</html>
