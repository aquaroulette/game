
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Stardos+Stencil:wght@400;700&display=swap" rel="stylesheet">

    <title>AquaRoulette</title>
    <link rel="stylesheet" href="styles.css">

    <script src="https://cdn.jsdelivr.net/npm/qrcode@latest" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="java.js" defer></script>
</head>

<body>

    <!-- ANIMATED BACKGROUND: EXACTLY 200 CIRCLES -->
    <div class="chips" id="background-chips" aria-hidden="true"></div>

    <div class="container">

        <div class="title">
            <h1>AquaRoulette</h1>
            <p>Not a Simulation. Take Your Chance.</p>
        </div>

        <!-- LIVE STREAM -->
        <div class="live-screen">
            <video
                id="player"
                autoplay
                muted
                playsinline
                loop
            ></video>
        </div>

        <!-- WALLET -->
        <div class="wallet-box">
            <label for="wallet">
                Ready? Enter Your Ðogecoin receiving address:
            </label>

            <input
                type="text"
                id="wallet"
                class="wallet-input"
                minlength="34"
                maxlength="34"
                pattern="[A-Za-z0-9]{34}"
                required
                oninput="this.value = this.value.replace(/[^A-Za-z0-9]/g, '').slice(0, 34)"
            >
        </div>

        <!-- ROULETTE -->
        <div class="roulette">

            <div class="zero-row">
                <button type="button" class="ball green" data-number="0">0</button>
            </div>

            <div class="grid" id="grid"></div>

        </div>

        <!-- SUBMIT -->
        <div class="submit-container">

            <button
                id="submit-button"
                class="vortex-button"
                type="button"
                onclick="
                    const wallet = document.getElementById('wallet').value;
                    const number = document.getElementById('selectedNumber').textContent.trim();

                    if (!/^[A-Za-z0-9]{34}$/.test(wallet)) {
                        document.getElementById('wallet').focus();
                        document.getElementById('wallet').reportValidity();
                        return;
                    }

                    if (number === '' || number === '—') {
                        alert('Please select a roulette number first.');
                        return;
                    }

                    submitForm();

                    this.classList.add('arrow-active');
                    this.querySelector('.button-text').textContent = '↓';
                "
            >
                <span class="button-text">Submit</span>
            </button>

            <div id="please-wait" style="display:none; margin-top:10px;">
                Generating Ðogecoin payment QR code. Please wait
                <span id="dots">...</span>
            </div>

        </div>

        <!-- RESULT -->
        <div class="selection">

            <h2>
                Your Pick:
                <span id="selectedNumber">—</span>
            </h2>

            <p class="wallet-preview">
                Your Wallet:
                <span class="highlight" id="selectedWallet">—</span>
            </p>

            <div id="qrCode"></div>

            <button id="copy-button" style="display:none;">
                Copy Address
            </button>

            <div id="address-container"></div>

            <div id="payment-status" style="display:none;">
                Waiting for Your payment...
                <p>Min: 30Ð Max: 3000Ð</p>
                <p>Payout: 36:1</p>
                <p>QR valid until game starts</p>
            </div>

        </div>

    </div>

    <!-- GENERATE EXACTLY 200 RANDOM BOUNCING CIRCLES -->
    <script>
    (() => {

        const background = document.getElementById('background-chips');

        const totalChips = 200;

        const colors = ['red', 'black'];

        const chips = [];

        const restitution = 0.95;

        const FADE_IN = 8;
        const FADE_OUT = 18;

        let width = window.innerWidth;
        let height = window.innerHeight;

        let lastTime = 0;

        // Random number helper.
        function random(min, max) {
            return min + Math.random() * (max - min);
        }

        // Give every circle a new independent lifetime.
        function randomLifetime() {
            return random(120, 300);
        }

        // Create a circle.
        function createChip(index) {

            const chip = document.createElement('div');

            const color = index === 0
                ? 'green'
                : colors[Math.floor(Math.random() * colors.length)];

            const size = random(5, 35);

            chip.className = 'chip ' + color;

            chip.style.setProperty('--size', size + 'px');

            background.appendChild(chip);

            const lifetime = randomLifetime();

            return {

                element: chip,

                radius: size / 2,

                x: random(size, width - size),
                y: random(size, height - size),

                vx: random(-100, 100),
                vy: random(-100, 100),

                age: random(0, lifetime * 0.75),

                lifetime: lifetime,

                opacity: 0

            };
        }

        // Create all 200 circles.
        for (let i = 0; i < totalChips; i++) {

            chips.push(createChip(i));

        }

        // Give a circle a fresh life when its lifetime ends.
        function respawn(chip) {

            chip.x = random(chip.radius, width - chip.radius);
            chip.y = random(chip.radius, height - chip.radius);

            chip.vx = random(-100, 100);
            chip.vy = random(-100, 100);

            chip.age = 0;

            chip.lifetime = randomLifetime();

            chip.opacity = 0;

        }

        // Handle collisions between circles.
        function handleCollisions() {

            for (let i = 0; i < chips.length; i++) {

                for (let j = i + 1; j < chips.length; j++) {

                    const a = chips[i];
                    const b = chips[j];

                    const dx = b.x - a.x;
                    const dy = b.y - a.y;

                    const distance = Math.sqrt(dx * dx + dy * dy);

                    const minDistance = a.radius + b.radius;

                    if (distance === 0 || distance >= minDistance) {
                        continue;
                    }

                    const nx = dx / distance;
                    const ny = dy / distance;

                    const overlap = minDistance - distance;

                    // Separate overlapping circles.
                    a.x -= nx * overlap / 2;
                    a.y -= ny * overlap / 2;

                    b.x += nx * overlap / 2;
                    b.y += ny * overlap / 2;

                    // Calculate relative velocity.
                    const relativeVelocity =
                        (b.vx - a.vx) * nx +
                        (b.vy - a.vy) * ny;

                    if (relativeVelocity > 0) {
                        continue;
                    }

                    // Collision impulse.
                    const impulse =
                        -(1 + restitution) * relativeVelocity / 2;

                    a.vx -= impulse * nx;
                    a.vy -= impulse * ny;

                    b.vx += impulse * nx;
                    b.vy += impulse * ny;

                }

            }

        }

        // Main animation loop.
        function animate(time) {

            if (!lastTime) {
                lastTime = time;
            }

            const delta = Math.min((time - lastTime) / 1000, 0.05);

            lastTime = time;

            for (const chip of chips) {

                // Update individual lifetime.
                chip.age += delta;

                // Respawn independently when lifetime ends.
                if (chip.age >= chip.lifetime) {

                    respawn(chip);

                }

                // Calculate independent fade-in.
                const fadeIn = Math.min(
                    chip.age / FADE_IN,
                    1
                );

                // Calculate independent fade-out.
                const remaining =
                    chip.lifetime - chip.age;

                const fadeOut = Math.min(
                    remaining / FADE_OUT,
                    1
                );

                chip.opacity =
                    0.24 * Math.min(fadeIn, fadeOut);

                // Move circle.
                chip.x += chip.vx * delta;
                chip.y += chip.vy * delta;

                // Bounce off left and right walls.
                if (chip.x - chip.radius < 0) {

                    chip.x = chip.radius;
                    chip.vx = Math.abs(chip.vx);

                }

                if (chip.x + chip.radius > width) {

                    chip.x = width - chip.radius;
                    chip.vx = -Math.abs(chip.vx);

                }

                // Bounce off top and bottom walls.
                if (chip.y - chip.radius < 0) {

                    chip.y = chip.radius;
                    chip.vy = Math.abs(chip.vy);

                }

                if (chip.y + chip.radius > height) {

                    chip.y = height - chip.radius;
                    chip.vy = -Math.abs(chip.vy);

                }

            }

            // Handle circle-to-circle collisions.
            handleCollisions();

            // Render circles.
            for (const chip of chips) {

                chip.element.style.transform =
                    `translate3d(${chip.x - chip.radius}px, ${chip.y - chip.radius}px, 0)`;

                chip.element.style.opacity = chip.opacity;

            }

            requestAnimationFrame(animate);

        }

        // Keep circles inside the screen after resizing.
        window.addEventListener('resize', () => {

            width = window.innerWidth;
            height = window.innerHeight;

            for (const chip of chips) {

                chip.x = Math.max(
                    chip.radius,
                    Math.min(width - chip.radius, chip.x)
                );

                chip.y = Math.max(
                    chip.radius,
                    Math.min(height - chip.radius, chip.y)
                );

            }

        });

        requestAnimationFrame(animate);

    })();
    </script>

</body>
</html>
